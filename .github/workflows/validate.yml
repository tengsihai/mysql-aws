name: 校验

# 零凭据的快速反馈，PR 阶段就能跑（fork PR 也一样）。
# 两个 job：
#   1. 规范与密钥检查 —— 命名、版本号、有没有把口令写进 SQL/配置
#   2. Flyway 实跑     —— 在临时 MySQL 8.4 里把所有迁移真跑一遍，抓 SQL 语法/方言错误
#
# 分支模型：dev / staging / prod 是环境分支，main 是发布后的归档分支（不触发 CI）。
# 合并前在 PR 上拦住问题，合并后由 migrate.yml 真正打到 RDS。

on:
  pull_request:
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地开发保持同一个 Flyway 版本，避免「本地过、CI 挂」
  FLYWAY_VERSION: '13.12.1'

jobs:
  conventions:
    name: 规范与密钥检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-conventions.sh 要对比历史提交，需要完整历史
          fetch-depth: 0

      - name: 检查迁移文件规范与密钥泄露
        run: ./scripts/check-conventions.sh

  flyway-verify:
    name: Flyway 实跑校验（临时 MySQL）
    runs-on: ubuntu-latest
    needs: conventions

    services:
      mysql:
        # 与 RDS 上的引擎大版本保持一致（RDS 当前是 MySQL 8.4）
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      # 只在临时库生效，覆盖 flyway.conf 里的 RDS 地址。
      # 临时库是本机回环，关掉 TLS 并允许取公钥，避免容器内证书问题。
      FLYWAY_URL: 'jdbc:mysql://127.0.0.1:3306/appdb?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC'
      FLYWAY_USER: 'root'
      FLYWAY_PASSWORD: 'root'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Flyway
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/flyway.tar.gz \
            "https://github.com/flyway/flyway/releases/download/flyway-${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/flyway.tar.gz -C /tmp
          echo "/tmp/flyway-commandline-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: 等待 MySQL 端口就绪
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "MySQL 端口已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "等待 MySQL 超时" >&2
          exit 1

      - name: flyway migrate
        run: flyway -configFiles=flyway.conf migrate

      - name: flyway validate
        run: flyway -configFiles=flyway.conf validate

      - name: flyway info
        run: flyway -configFiles=flyway.conf info

      - name: 校验种子数据确实写进去了
        run: |
          set -euo pipefail
          # 服务容器就在 runner 的 docker 里，直接 exec 进去查行数
          cid=$(docker ps --filter "ancestor=mysql:8.4" --format '{{.ID}}' | head -n 1)
          if [ -z "${cid}" ]; then
            echo "找不到 mysql 服务容器" >&2
            docker ps >&2
            exit 1
          fi
          count=$(docker exec "${cid}" mysql -uroot -proot -N -B \
            -e "SELECT COUNT(*) FROM appdb.t_migration_check;")
          echo "t_migration_check 行数：${count}"
          if [ "${count}" != "5" ]; then
            echo "期望 5 行种子数据，实际 ${count} 行" >&2
            exit 1
          fi
