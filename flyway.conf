# ---------------------------------------------------------------------------
# Flyway 开发环境（dev）配置
#
# 安全约定：
#   * 本文件只存放非敏感配置。任何密码、AccessKey、私钥都禁止写进来。
#   * 数据库口令由 scripts/migrate.sh 在运行时从 AWS Secrets Manager 取出，
#     以环境变量 FLYWAY_PASSWORD 注入。Flyway 的环境变量优先级高于配置文件，
#     所以这里即使写了 password 也会被覆盖——但我们根本不写。
#   * 连接地址是本文件唯一的连接信息来源：scripts/migrate.sh 会解析
#     flyway.url 得到主机、端口、库名，再据此建立 SSM 端口转发，避免两处配置漂移。
#
# 本地直连（已通过 VPN / 内网可达 RDS 时）：
#     FLYWAY_PASSWORD="$(...)" flyway info
# 一般情况（RDS 在私有子网，需要走跳板机）：
#     ./scripts/migrate.sh info
# ---------------------------------------------------------------------------

flyway.url=jdbc:mysql://platform-dev-mysql.cpoqucm0uydh.ap-northeast-1.rds.amazonaws.com:3306/appdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC
flyway.user=admin

# 迁移脚本目录（相对仓库根目录）
flyway.locations=filesystem:sql

# 版本历史表与默认 schema
flyway.table=flyway_schema_history
flyway.defaultSchema=appdb
flyway.encoding=UTF-8

# 版本规范：V<数字>__<描述>.sql；可重复脚本用 R__<描述>.sql
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__

# 执行策略：
#   * outOfOrder=false —— 只按版本号顺序执行，乱序提交的版本会被拒绝
#   * validateOnMigrate=true —— 每次迁移前校验已执行脚本的 checksum
#   * baselineOnMigrate=false —— 空库不允许被 baseline 跳过，必须从 V1 走起
#   * cleanDisabled=true —— 彻底禁用 flyway clean，防止误清库
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
